<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamique de l'occupation du sol en 3D — Natitingou</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0F2138; --ink-soft:#1B324E; --paper:#EDEFE9;
    --brass:#C08A3E; --brass-dark:#A2712F;
    --sage:#5C7A66; --slate:#486074;
    --change:#FF3C78;
    --border:#2C4460;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; font-family:'Public Sans',sans-serif; background:var(--ink); color:#EDEFE9; overflow:hidden; }

  .oc-app{ display:flex; flex-direction:column; height:100vh; }

  header.oc-bar{
    background:var(--ink); border-bottom:1px solid var(--brass-dark);
    padding:0.9rem 1.2rem; display:flex; align-items:baseline; gap:0.7rem; flex-wrap:wrap; z-index:2;
  }
  header.oc-bar h1{ font-family:'Fraunces',serif; font-size:1.1rem; margin:0; color:#fff; font-weight:700; }
  header.oc-bar span.tag{
    font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.08em;
    color:var(--brass); border:1px solid var(--brass-dark); padding:0.15rem 0.5rem; border-radius:3px;
  }

  .oc-body{ flex:1; position:relative; min-height:0; }
  #canvas-wrap{ position:absolute; inset:0; }
  canvas{ display:block; }

  .oc-panel{
    position:absolute; top:1rem; left:1rem; width:280px;
    background:rgba(27,50,78,0.92); border:1px solid var(--border); border-radius:8px;
    padding:1rem; backdrop-filter:blur(4px); max-height:calc(100vh - 3rem); overflow-y:auto;
  }
  .oc-panel h2{
    font-family:'JetBrains Mono',monospace; font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase;
    color:#8FA0AE; margin:0 0 0.5rem;
  }
  .oc-row{ margin-bottom:0.9rem; }

  .oc-years{ display:flex; gap:0.4rem; margin-bottom:0.6rem; }
  .oc-years button, .oc-mode button{
    flex:1; background:var(--ink); color:#EDEFE9; border:1px solid var(--border); border-radius:4px;
    padding:0.45rem 0.3rem; font-family:'Public Sans',sans-serif; font-size:0.8rem; cursor:pointer;
  }
  .oc-years button.active, .oc-mode button.active{ background:var(--brass-dark); border-color:var(--brass); }

  .oc-row label{ display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:0.3rem; }
  .oc-row span.val{ font-family:'JetBrains Mono',monospace; color:var(--brass); }
  input[type="range"]{ width:100%; accent-color:var(--brass); }

  .oc-legend{ display:flex; flex-direction:column; gap:0.35rem; font-size:0.78rem; }
  .oc-legend div{ display:flex; align-items:center; gap:0.5rem; }
  .oc-legend .dot{ width:11px; height:11px; border-radius:50%; flex-shrink:0; border:1px solid rgba(255,255,255,0.25); }

  .oc-stat{
    background:var(--ink); border:1px solid var(--border); border-radius:6px; padding:0.7rem;
    font-family:'JetBrains Mono',monospace; text-align:center; margin-top:0.4rem;
  }
  .oc-stat strong{ display:block; font-size:1.4rem; color:var(--change); font-family:'Fraunces',serif; }
  .oc-stat small{ color:#8FA0AE; font-size:0.62rem; text-transform:uppercase; }

  .oc-loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; color:#8FA0AE; font-size:0.85rem;
  }
</style>
</head>
<body>

<div class="oc-app">
  <header class="oc-bar">
    <h1>Dynamique de l'occupation du sol — Natitingou</h1>
    <span class="tag">SENTINEL-2 10M · 2017 vs 2025</span>
  </header>

  <div class="oc-body">
    <div id="canvas-wrap"></div>
    <div class="oc-loading" id="loading">Chargement du relief et des occupations du sol…</div>

    <div class="oc-panel" id="panel" style="display:none;">
      <h2>Affichage</h2>
      <div class="oc-mode" style="display:flex; gap:0.4rem; margin-bottom:0.6rem;">
        <button id="modeOcs" class="active">Occupation du sol</button>
        <button id="modeAlt">Altitude</button>
      </div>

      <div id="yearControls">
        <h2>Année</h2>
        <div class="oc-years">
          <button id="y2017" class="active">2017</button>
          <button id="y2025">2025</button>
          <button id="yChange">Changements</button>
        </div>
      </div>

      <h2>Relief</h2>
      <div class="oc-row">
        <label>Exagération verticale <span class="val" id="exagVal">15×</span></label>
        <input type="range" id="exag" min="1" max="40" step="1" value="15">
      </div>

      <h2>Légende</h2>
      <div class="oc-legend" id="legend">
        <div><span class="dot" style="background:#1A5BAB"></span> Eau</div>
        <div><span class="dot" style="background:#358221"></span> Arbres</div>
        <div><span class="dot" style="background:#87D19E"></span> Végétation inondée</div>
        <div><span class="dot" style="background:#FFDB5C"></span> Cultures</div>
        <div><span class="dot" style="background:#ED022A"></span> Surface bâtie</div>
        <div><span class="dot" style="background:#EDE9E4"></span> Terrain nu</div>
        <div><span class="dot" style="background:#C6AD8D"></span> Prairies</div>
      </div>

      <div class="oc-stat">
        <strong id="statChange">–</strong>
        <small>des cellules ont changé de classe (2017→2025)</small>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const wrap = document.getElementById('canvas-wrap');
const loading = document.getElementById('loading');
const panel = document.getElementById('panel');

const PLANE_WIDTH = 100;
let PLANE_DEPTH = 100;
let gridW, gridH, elevMin, elevMax, exaggeration = 15;
let heights, colorsElev, colors2017, colors2025, colorsChange;
let terrainMesh;

const scene = new THREE.Scene();
function makeSkyTexture() {
  const c = document.createElement('canvas'); c.width=2; c.height=256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#0B1B33'); g.addColorStop(0.45,'#2E5C82'); g.addColorStop(0.75,'#7FA8C4'); g.addColorStop(1,'#C7D8E2');
  ctx.fillStyle=g; ctx.fillRect(0,0,2,256);
  return new THREE.CanvasTexture(c);
}
scene.background = makeSkyTexture();
scene.fog = new THREE.Fog(0x7FA8C4, 140, 320);

const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth/wrap.clientHeight, 0.1, 1000);
camera.position.set(65, 60, 95);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(wrap.clientWidth, wrap.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
wrap.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const sun = new THREE.DirectionalLight(0xfff2d9, 1.05);
sun.position.set(-70,130,50);
scene.add(sun);

function loadImage(src){ return new Promise((res,rej)=>{const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=src;}); }
function readRGBA(img,w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
  return ctx.getImageData(0,0,w,h).data;
}
function readGray(img,w,h){
  const data = readRGBA(img,w,h);
  const arr = new Float32Array(w*h);
  for (let i=0;i<w*h;i++) arr[i]=data[i*4]/255;
  return arr;
}
function rgbaToColorArray(data, count) {
  const arr = new Float32Array(count*3);
  for (let i=0;i<count;i++){ arr[i*3]=data[i*4]/255; arr[i*3+1]=data[i*4+1]/255; arr[i*3+2]=data[i*4+2]/255; }
  return arr;
}

function colorForElevation(t){
  const stops=[[0,[92,122,102]],[0.55,[192,138,62]],[1,[237,239,233]]];
  for (let i=0;i<stops.length-1;i++){
    const [t0,c0]=stops[i], [t1,c1]=stops[i+1];
    if (t>=t0&&t<=t1){ const f=(t-t0)/(t1-t0);
      return [Math.round(c0[0]+f*(c1[0]-c0[0])),Math.round(c0[1]+f*(c1[1]-c0[1])),Math.round(c0[2]+f*(c1[2]-c0[2]))]; }
  }
  return stops[stops.length-1][1];
}

async function init() {
  const meta = await (await fetch('./data/mnt-natitingou-heightmap-meta.json')).json();
  gridW = meta.width; gridH = meta.height;
  elevMin = meta.elev_min; elevMax = meta.elev_max;
  PLANE_DEPTH = PLANE_WIDTH * (gridH/gridW);

  const [hImg, ocs2017Img, ocs2025Img, changeImg, ocsMeta] = await Promise.all([
    loadImage('./data/mnt-natitingou-heightmap.png'),
    loadImage('./data/ocs_2017_colored.png'),
    loadImage('./data/ocs_2025_colored.png'),
    loadImage('./data/ocs_change_colored.png'),
    fetch('./data/ocs_meta.json').then(r=>r.json())
  ]);

  const rawH = readGray(hImg, gridW, gridH);
  heights = rawH;

  const count = gridW*gridH;
  colors2017 = rgbaToColorArray(readRGBA(ocs2017Img, gridW, gridH), count);
  colors2025 = rgbaToColorArray(readRGBA(ocs2025Img, gridW, gridH), count);
  colorsChange = rgbaToColorArray(readRGBA(changeImg, gridW, gridH), count);

  colorsElev = new Float32Array(count*3);
  for (let i=0;i<count;i++){
    const [r,g,b] = colorForElevation(heights[i]);
    colorsElev[i*3]=r/255; colorsElev[i*3+1]=g/255; colorsElev[i*3+2]=b/255;
  }

  document.getElementById('statChange').textContent = ocsMeta.pct_changed + '%';

  buildTerrain(exaggeration);
  setColorSet(colors2017);

  loading.style.display='none';
  panel.style.display='block';
  animate();
}

function buildTerrain(exag) {
  if (terrainMesh) scene.remove(terrainMesh);
  const geometry = new THREE.PlaneGeometry(PLANE_WIDTH, PLANE_DEPTH, gridW-1, gridH-1);
  geometry.rotateX(-Math.PI/2);
  const pos = geometry.attributes.position;

  const realWidthKm = 61.5;
  const unitsPerKm = PLANE_WIDTH/realWidthKm;
  const exagUnits = (exag*unitsPerKm)/1000;

  for (let i=0;i<gridW*gridH;i++){
    const elevM = elevMin + heights[i]*(elevMax-elevMin);
    pos.setY(i, elevM*exagUnits);
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(currentColors ? currentColors.slice() : colors2017.slice(), 3));
  geometry.computeVertexNormals();

  const material = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.92, metalness:0.03 });
  terrainMesh = new THREE.Mesh(geometry, material);
  scene.add(terrainMesh);
}

let currentColors = null;
function setColorSet(arr) {
  currentColors = arr;
  if (!terrainMesh) return;
  terrainMesh.geometry.attributes.color.set(arr);
  terrainMesh.geometry.attributes.color.needsUpdate = true;
}

// ---------------------------------------------------------------
// Contrôles
// ---------------------------------------------------------------
document.getElementById('exag').addEventListener('input', e=>{
  exaggeration = parseFloat(e.target.value);
  document.getElementById('exagVal').textContent = exaggeration+'×';
  buildTerrain(exaggeration);
});

function setActiveYearButton(id) {
  ['y2017','y2025','yChange'].forEach(b=>document.getElementById(b).classList.toggle('active', b===id));
}
document.getElementById('y2017').addEventListener('click', ()=>{ setColorSet(colors2017); setActiveYearButton('y2017'); });
document.getElementById('y2025').addEventListener('click', ()=>{ setColorSet(colors2025); setActiveYearButton('y2025'); });
document.getElementById('yChange').addEventListener('click', ()=>{ setColorSet(colorsChange); setActiveYearButton('yChange'); });

document.getElementById('modeOcs').addEventListener('click', (e)=>{
  e.target.classList.add('active'); document.getElementById('modeAlt').classList.remove('active');
  document.getElementById('yearControls').style.display = 'block';
  document.getElementById('legend').style.display = 'flex';
  setColorSet(colors2017); setActiveYearButton('y2017');
});
document.getElementById('modeAlt').addEventListener('click', (e)=>{
  e.target.classList.add('active'); document.getElementById('modeOcs').classList.remove('active');
  document.getElementById('yearControls').style.display = 'none';
  document.getElementById('legend').style.display = 'none';
  setColorSet(colorsElev);
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
window.addEventListener('resize', ()=>{
  camera.aspect = wrap.clientWidth/wrap.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
});

init();
</script>

</body>
</html>
